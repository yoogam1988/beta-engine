<svg width="280" height="80" viewBox="0 0 280 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="atomflow-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#155aef"/>
      <stop offset="100%" style="stop-color:#296dff"/>
    </linearGradient>
    <filter id="atomflow-glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 流动线条 -->
  <path d="M 20 45 Q 35 15 50 45 Q 65 75 80 45" fill="none" stroke="url(#atomflow-gradient)" stroke-width="3.5" stroke-linecap="round" filter="url(#atomflow-glow)"/>
  <path d="M 20 35 Q 35 5 50 35 Q 65 65 80 35" fill="none" stroke="url(#atomflow-gradient)" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <path d="M 20 55 Q 35 25 50 55 Q 65 85 80 55" fill="none" stroke="url(#atomflow-gradient)" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

  <!-- 粒子/原子 -->
  <circle cx="30" cy="40" r="3.5" fill="url(#atomflow-gradient)"/>
  <circle cx="50" cy="30" r="3.5" fill="url(#atomflow-gradient)"/>
  <circle cx="70" cy="40" r="3.5" fill="url(#atomflow-gradient)"/>

  <!-- 文字 -->
  <text x="95" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="700" fill="#1a1a2e">AtomFlow</text>
</svg>
